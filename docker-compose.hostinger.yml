services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtec
      POSTGRES_PASSWORD: ${GTEC_DB_PASSWORD:?Defina GTEC_DB_PASSWORD}
      POSTGRES_DB: gtec_control
    volumes:
      - gtec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtec -d gtec_control"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: https://github.com/Feitosa98/G-tec.git#main
      args:
        VITE_BASE_PATH: /
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: gtec
      PGPASSWORD: ${GTEC_DB_PASSWORD:?Defina GTEC_DB_PASSWORD}
      PGDATABASE: gtec_control
      SAAS_ADMIN_USER: ${SAAS_ADMIN_USER:-gestor}
      SAAS_ADMIN_PASSWORD: ${SAAS_ADMIN_PASSWORD:?Defina SAAS_ADMIN_PASSWORD}
      SAAS_TOKEN_SECRET: ${SAAS_TOKEN_SECRET:?Defina SAAS_TOKEN_SECRET}
      NFSE_SECRET_KEY: ${NFSE_SECRET_KEY:-}
      DEFAULT_STORE_ADMIN_PASSWORD: ${DEFAULT_STORE_ADMIN_PASSWORD:?Defina DEFAULT_STORE_ADMIN_PASSWORD}
    ports:
      - "8081:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gtec-saas.rule=Host(`sistema.feitosasolucoes.com.br`)"
      - "traefik.http.routers.gtec-saas.entrypoints=websecure"
      - "traefik.http.routers.gtec-saas.tls=true"
      - "traefik.http.routers.gtec-saas.tls.certresolver=letsencrypt"
      - "traefik.http.services.gtec-saas.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik-proxy
    security_opt:
      - no-new-privileges:true

volumes:
  gtec_postgres_data:

networks:
  traefik-proxy:
    external: true
