services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: gtec
      MYSQL_PASSWORD: ${GTEC_DB_PASSWORD:?Defina GTEC_DB_PASSWORD}
      MYSQL_DATABASE: gtec
      MYSQL_ROOT_PASSWORD: ${GTEC_DB_ROOT_PASSWORD:?Defina GTEC_DB_ROOT_PASSWORD}
    volumes:
      - gtec_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugtec", "--password=${GTEC_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: https://github.com/Feitosa98/G-tec.git#main
      args:
        VITE_BASE_PATH: /
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gtec
      DB_PASSWORD: ${GTEC_DB_PASSWORD:?Defina GTEC_DB_PASSWORD}
      DB_NAME: gtec
      SAAS_ADMIN_USER: ${SAAS_ADMIN_USER:-gestor}
      SAAS_ADMIN_PASSWORD: ${SAAS_ADMIN_PASSWORD:?Defina SAAS_ADMIN_PASSWORD}
      SAAS_TOKEN_SECRET: ${SAAS_TOKEN_SECRET:?Defina SAAS_TOKEN_SECRET}
      NFSE_SECRET_KEY: ${NFSE_SECRET_KEY:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Defina DATA_ENCRYPTION_KEY}
      DEFAULT_STORE_ADMIN_PASSWORD: ${DEFAULT_STORE_ADMIN_PASSWORD:?Defina DEFAULT_STORE_ADMIN_PASSWORD}
    ports:
      - "8081:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gtec-saas.rule=Host(`sistema.feitosasolucoes.com.br`)"
      - "traefik.http.routers.gtec-saas.entrypoints=websecure"
      - "traefik.http.routers.gtec-saas.tls=true"
      - "traefik.http.routers.gtec-saas.tls.certresolver=letsencrypt"
      - "traefik.http.services.gtec-saas.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik-proxy
    security_opt:
      - no-new-privileges:true

volumes:
  gtec_mysql_data:

networks:
  traefik-proxy:
    external: true
